<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#121215" stop-opacity="1"/>
    </radialGradient>

    <!-- Isometric Cube Gradients -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Filament Spool Glow -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Studio Canvas Background -->
  <rect width="640" height="480" fill="url(#bgGlow)"/>

  <!-- Print Bed Isometric Ellipse Plate -->
  <ellipse cx="320" cy="290" rx="210" ry="85" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <ellipse cx="320" cy="290" rx="190" ry="76" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <ellipse cx="320" cy="290" rx="130" ry="52" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Bed Crosshairs -->
  <line x1="130" y1="290" x2="510" y2="290" stroke="#27272a" stroke-width="1"/>
  <line x1="320" y1="205" x2="320" y2="375" stroke="#27272a" stroke-width="1"/>

  <!-- Center Build Plate Target -->
  <ellipse cx="320" cy="290" rx="40" ry="16" fill="none" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>

  <!-- 3D Printed Isometric Cube -->
  <g transform="translate(0, -15)">
    <!-- Shadow under model -->
    <ellipse cx="320" cy="295" rx="75" ry="30" fill="#09090b" opacity="0.6"/>

    <!-- Left Face -->
    <polygon points="245,160 320,202 320,285 245,243" fill="url(#cubeLeft)"/>

    <!-- Right Face -->
    <polygon points="320,202 395,160 395,243 320,285" fill="url(#cubeRight)"/>

    <!-- Top Face -->
    <polygon points="320,118 395,160 320,202 245,160" fill="url(#cubeTop)"/>

    <!-- Layer Lines (FDM Simulation on Left Face) -->
    <line x1="245" y1="180" x2="320" y2="222" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <line x1="245" y1="200" x2="320" y2="242" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <line x1="245" y1="220" x2="320" y2="262" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- Layer Lines (FDM Simulation on Right Face) -->
    <line x1="320" y1="222" x2="395" y2="180" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
    <line x1="320" y1="242" x2="395" y2="200" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
    <line x1="320" y1="262" x2="395" y2="220" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>

    <!-- Wireframe Edge Highlights -->
    <polyline points="245,160 320,202 395,160" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <line x1="320" y1="202" x2="320" y2="285" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <polygon points="320,118 395,160 320,202 245,160" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1"/>
  </g>

  <!-- Extruder / Nozzle Accent at Top Corner -->
  <circle cx="320" cy="98" r="4" fill="#f97316"/>
  <line x1="320" y1="75" x2="320" y2="94" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>

  <!-- Glowing Divider line -->
  <line x1="220" y1="400" x2="420" y2="400" stroke="url(#accentGlow)" stroke-width="1.5"/>

  <!-- Brand Typography -->
  <text x="320" y="424" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#e4e4e7">PRINTVAULT</text>
  <text x="320" y="442" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#71717a">3D MODEL PREVIEW</text>
</svg>
